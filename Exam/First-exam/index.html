<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="signup-card">
        <div class="card-header">
            <div class="title-container">
                <h1>Register</h1>
                <p>Fast & Easy & Secure</p>
            </div>
            <button class="close-btn">&times;</button>
        </div>
        <hr class="divider">
        <form action="#" method="POST">
            <div class="input-row">
                <input type="text" placeholder="ชื่อ (Name)" required>
                <input type="text" placeholder="นามสกุล (Surname)" required>
            </div>
            <div class="input-full">
                <input type="text" placeholder="หมายเลขโทรศัพท์มือถือหรืออีเมล (Phone Number or Email)" required>
            </div>
            <div class="input-full">
                <input type="password" placeholder="รหัสผ่านใหม่ (New Password)" required>
            </div>
            <div class="section-title">วันเกิด (Birthday)</div>
            <div class="input-row dob-row">
                <select name="day">
                    <option value="14">1</option>
                    <option value="14">2</option>
                    <option value="14">3</option>
                    <option value="14">4</option>
                    <option value="14">5</option>
                    <option value="14">6</option>
                    <option value="14">7</option>
                    <option value="14">8</option>
                    <option value="14">9</option>
                    <option value="14">10</option>
                    <option value="14">11</option>
                    <option value="14">12</option>
                    <option value="14">13</option>
                    <option value="14">14</option>
                    <option value="14">15</option>
                    <option value="14">16</option>
                    <option value="14">17</option>
                    <option value="14">18</option>
                    <option value="14">19</option>
                    <option value="14">20</option>
                    <option value="14">21</option>
                    <option value="14">22</option>
                    <option value="14">23</option>
                    <option value="14">24</option>
                    <option value="14">25</option>
                    <option value="14">26</option>
                    <option value="14">27</option>
                    <option value="14">28</option>
                    <option value="14">29</option>
                    <option value="14">30</option>
                    <option value="14">31</option>
                </select>
                <select name="month">
                    <option value="ก.ย.">Jan</option>
                    <option value="ก.ย.">Feb</option>
                    <option value="ก.ย.">Mar</option>
                    <option value="ก.ย.">Apr</option>
                    <option value="ก.ย.">May</option>
                    <option value="ก.ย.">Jun</option>
                    <option value="ก.ย.">Jul</option>
                    <option value="ก.ย.">Aug</option>
                    <option value="ก.ย.">Sep</option>
                    <option value="ก.ย.">Oct</option>
                    <option value="ก.ย.">Nov</option>
                    <option value="ก.ย.">Dec</option>
                </select>
                <select name="year">
                    <option value="2020">2000</option>
                    <option value="2020">2001</option>
                    <option value="2020">2002</option>
                    <option value="2020">2003</option>
                    <option value="2020">2004</option>
                    <option value="2020">2005</option>
                    <option value="2020">2006</option>
                    <option value="2020">2007</option>
                    <option value="2020">2008</option>
                    <option value="2020">2009</option>
                    <option value="2020">2010</option>
                    <option value="2020">2011</option>
                    <option value="2020">2012</option>
                    <option value="2020">2013</option>
                    <option value="2020">2014</option>
                    <option value="2020">2015</option>
                    <option value="2020">2016</option>
                    <option value="2020">2017</option>
                    <option value="2020">2018</option>
                    <option value="2020">2019</option>
                    <option value="2020">2020</option>
                </select>
            </div>
            <div class="section-title">เพศ (Gender)</div>
            <div class="input-row gender-row">
                <label class="gender-box">
                    <span>หญิง (Female)</span>
                    <input type="radio" name="gender" value="female">
                </label>
                <label class="gender-box">
                    <span>ชาย (Male)</span>
                    <input type="radio" name="gender" value="male">
                </label>
                <label class="gender-box">
                    <span>LGBTQ+</span>
                    <input type="radio" name="gender" value="male">
                </label>
            </div>
            <button type="submit" class="submit-btn">สมัคร</button>
            <p class="terms-text">
                Copyright @ 2026, Pattaradanai Saiwongkham | All Right Reserved.
            </p>
        </form>
    </div>

</body>
</html>
