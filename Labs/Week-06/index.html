<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Assignment</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f7f6;
            font-family: 'Kanit', sans-serif;
        }
        .empty-card {
            background: #ffffff;
            padding: 50px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border-top: 5px solid #a0a0a0;
        }
        .icon {
            font-size: 70px;
            margin-bottom: 15px;
            line-height: 1;
        }
        h1 {
            color: #0f2557;
            font-size: 1.5rem;
            margin: 0 0 10px 0;
        }
        p {
            color: #666666;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-back {
            display: inline-block;
            background-color: #0f2557;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.3s, transform 0.2s;
        }
        .btn-back:hover {
            background-color: #34495e;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="empty-card">
        <h1>ไม่มีชิ้นงานในส่วนนี้</h1>
        <p>สัปดาห์นี้ไม่มีการมอบหมายงาน การสอบ หรือแบบฝึกหัด (Try-it) ให้ทำครับ สามารถกลับไปดูผลงานในสัปดาห์อื่นๆ ได้เลย</p>
        <a href="../../index.html" class="btn-back">กลับสู่หน้าหลัก</a>
    </div>

</body>
</html>
